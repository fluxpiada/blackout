name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite OG/Twitter image URLs to absolute
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const base = `https://${owner}.github.io/${repo}`;
            const targets = ['index.html'];

            function rewriteMeta(html, prop) {
              const re = new RegExp(
                `<meta\\s+(?:property|name)=["']${prop}["']\\s+content=["']([^"']+)["']\\s*\\/?>`,
                'ig'
              );
              return html.replace(re, (m, url) => {
                if (url.startsWith('http')) return m;
                const normalized = url.replace(/^\//, '');
                const absolute = `${base}/${normalized}`;
                return m.replace(url, absolute);
              });
            }

            for (const f of targets) {
              if (!fs.existsSync(f)) continue;
              let html = fs.readFileSync(f, 'utf8');
              const before = html;
              html = rewriteMeta(html, 'og:image');
              html = rewriteMeta(html, 'twitter:image');
              if (html !== before) fs.writeFileSync(f, html, 'utf8');
            }

      - name: Update Download ePub button link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching latest release EPUB asset URL..."
          EPUB_URL=$(gh api repos/${{ github.repository }}/releases/latest --jq '.assets[] | select(.name | endswith(".epub")) | .browser_download_url' | head -n1)

          if [ -z "$EPUB_URL" ]; then
            echo "⚠️ No EPUB assets found in the latest release."
            exit 0
          fi

          echo "Updating 'Download ePub' button href to: $EPUB_URL"
          # Replace the <a> tag containing "Download ePub"
          sed -i.bak -E "s|<a[^>]*>Download ePub</a>|<a href=\"$EPUB_URL\" download>Download ePub</a>|g" index.html

          echo "✅ Updated index.html with latest EPUB link"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
