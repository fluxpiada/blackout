# .github/actions/notes-sync/action.yml
name: Notes Sync
description: Run notes sync via Python CLI

inputs:
  subset:
    description: Subset to process
    required: false
    default: all

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip install -U pip
        if [ -f pyproject.toml ]; then
          pip install .
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Run notes sync
      shell: bash
      run: python scripts/notes_sync.py --subset "${{ inputs.subset }}"
