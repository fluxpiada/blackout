# .github/actions/build-site/action.yml
name: Build site
description: Build static site into an output directory
inputs:
  out:
    description: Output directory
    required: false
    default: dist
  commit:
    description: Commit SHA to stamp into the page (optional)
    required: false
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install pandoc
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Build site
      shell: bash
      run: |
        python3 scripts/build_site.py --out "${{ inputs.out }}" --commit "${{ inputs.commit || github.sha }}"
