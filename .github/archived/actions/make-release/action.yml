# .github/actions/make-release/action.yml
name: Make Release
description: Build EPUB and other release assets
inputs:
  out:
    description: Output directory
    required: false
    default: build
  tag:
    description: Tag name (e.g. v1.2.3)
    required: false
runs:
  using: composite
  steps:
    - name: Set up Python
    # Python is only needed if your script is Python (it is).
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install system deps (pandoc)
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y pandoc
        pandoc -v

    - name: Install project deps (if any)
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install -U pip
        if [ -f pyproject.toml ]; then
          pip install .
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Build release artifacts
      shell: bash
      env:
        TAG_NAME: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        python scripts/make_release.py --out "${{ inputs.out }}" ${TAG_NAME:+--tag "$TAG_NAME"}
