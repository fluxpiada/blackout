name: Make Release
description: "Tag name (e.g. v1.2.3)"
required: false
runs:
using: "composite"
steps:
- uses: actions/setup-python@v5
with:
python-version: "3.12"
cache: "pip"

- name: Install system deps (pandoc)
shell: bash
run: |
sudo apt-get update
sudo apt-get install -y pandoc
pandoc -v

- shell: bash
run: |
pip install -U pip
if [ -f pyproject.toml ]; then
pip install .
elif [ -f requirements.txt ]; then
pip install -r requirements.txt
fi

- shell: bash
env:
TAG_NAME: ${{ inputs.tag }}
run: python scripts/make_release.py --out "${{ inputs.out }}" ${TAG_NAME:+--tag "$TAG_NAME"}
```yaml
name: Make Release
description: "Build release assets via Python CLI"
inputs:
out:
description: "Output directory"
default: "build"
tag:
description: "Tag name (e.g. v1.2.3)"
required: false
runs:
using: "composite"
steps:
- uses: actions/setup-python@v5
with:
python-version: "3.12"
cache: "pip"
- shell: bash
run: |
pip install -U pip
if [ -f pyproject.toml ]; then
pip install .
elif [ -f requirements.txt ]; then
pip install -r requirements.txt
fi
- shell: bash
env:
TAG_NAME: ${{ inputs.tag }}
run: python scripts/make_release.py --out "${{ inputs.out }}" ${TAG_NAME:+--tag "$TAG_NAME"}
