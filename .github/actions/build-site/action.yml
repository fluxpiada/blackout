name: Build Site
description: "Install deps and build the site via Python CLI"
inputs:
out:
description: "Output directory"
default: "dist"
runs:
using: "composite"
steps:
- uses: actions/setup-python@v5
with:
python-version: "3.12"
cache: "pip"
cache-dependency-path: |
requirements.txt
pyproject.toml
poetry.lock

- name: (optional) pandoc for README→index
shell: bash
run: |
sudo apt-get update
sudo apt-get install -y pandoc || true

- shell: bash
run: |
pip install -U pip
if [ -f pyproject.toml ]; then
pip install .
elif [ -f requirements.txt ]; then
pip install -r requirements.txt
fi

- shell: bash
run: python scripts/build_site.py --out "${{ inputs.out }}"
```yaml
name: Build Site
description: "Install deps and build the site via Python CLI"
inputs:
out:
description: "Output directory"
default: "dist"
runs:
using: "composite"
steps:
- uses: actions/setup-python@v5
with:
python-version: "3.12"
cache: "pip"
cache-dependency-path: |
requirements.txt
pyproject.toml
poetry.lock
- shell: bash
run: |
python -V
pip install -U pip
if [ -f pyproject.toml ]; then
pip install .
elif [ -f requirements.txt ]; then
pip install -r requirements.txt
fi
- shell: bash
run: python scripts/build_site.py --out "${{ inputs.out }}"
