# ================================
# Workflow: Filtered Release Notes
# File: .github/workflows/notes_filt.yml
# Purpose:
#   1) Generate release notes that include ONLY commits that touched /manuscript/*.md
#   2) Update the body of the published GitHub Release
#   3) Patch index.html on your site branch to link to that release (so Pages rebuilds)
# ================================

name: Generate filtered release notes

# ---- Triggers ---------------------------------------------------------------
# - On release publish (normal, automatic flow)
# - Manually (Actions -> this workflow -> Run workflow) with a `tag` input for testing
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to test (must already have a published GitHub Release)"
        required: true

# ---- Permissions ------------------------------------------------------------
# Needed to edit the release body and commit a change to index.html
permissions:
  contents: write

jobs:
  manuscript_release_notes_and_link:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history so compares and commit lookups work reliably
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Core logic: build filtered notes, update the Release, patch index.html
      - name: Generate filtered notes + update release + patch index.html
        uses: actions/github-script@v7
        with:
          # The `github-script` action gives you `github`, `context`, and `core`
          script: |
            // ------------- CONFIGURABLE KNOBS --------------------------------
            // Branch where your website's index.html lives (change if not 'main')
            const SITE_BRANCH = 'main';

            // Path filter: keep commits that touched files matching this regex.
            // Current behavior: non-recursive /manuscript/*.md (one level deep).
            // To make it recursive, change the regex to: ^manuscript\/.*\.md$
            const PATH_REGEX = /^manuscript\/[^/]+\.md$/i;

            // Section title marker we insert/replace in the Release body
            const SECTION_TITLE_PREFIX = '### Manuscript changes in';
            // ------------------------------------------------------------------

            const { owner, repo } = context.repo;
            const inputTag = context.payload?.inputs?.tag;

            // Resolve the release either from the event payload (normal publish)
            // or by the manual `tag` input (Run workflow).
            let rel = context.payload.release || null;
            let tag = rel?.tag_name;

            if (!rel) {
              if (!inputTag) {
                core.setFailed('No release payload and no manual tag input; provide a tag when running manually.');
                return;
              }
              tag = inputTag;
              try {
                const r = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                rel = r.data; // includes id, html_url, target_commitish, body, etc.
              } catch (e) {
                core.setFailed(`Release with tag "${tag}" not found or not published. Publish it first. Original error: ${e.message}`);
                return;
              }
            }

            core.info(`Using release tag: ${tag}`);

            // ------- Find the previous published release to compare the diff ---
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            // Only non-draft, non-prerelease
            const published = releases
              .filter(r => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            const thisIdx = published.findIndex(r => r.id === rel.id);
            const previousTag = thisIdx > 0 ? published[thisIdx - 1].tag_name : null;

            // ------------- Collect commits in the range ------------------------
            let commits = [];
            if (previousTag) {
              // Compare previousTag...currentTag
              const cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousTag}...${tag}`
              });
              commits = cmp.data.commits || [];
              core.info(`Compared commits between ${previousTag}...${tag}: ${commits.length} candidate commits`);
            } else {
              // First release fallback: take recent commits from the target branch
              const targetBranch = rel.target_commitish || 'main';
              commits = await github.paginate(
                github.rest.repos.listCommits,
                { owner, repo, sha: targetBranch, per_page: 100 }
              );
              core.info(`No previous release; using last ${commits.length} commits on ${targetBranch}`);
            }

            // ------------- Filter commits by touched files ---------------------
            const touched = [];
            for (const c of commits) {
              const sha = c.sha;
              const res = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              const files = res.data.files || [];
              const hit = files.some(f => PATH_REGEX.test(f.filename));
              if (hit) {
                touched.push({
                  sha,
                  message: (c.commit?.message || '(no message)').split('\n')[0],
                  url: c.html_url
                });
              }
            }
            core.info(`Filtered to ${touched.length} commits touching /manuscript/*.md`);

            // ------------- Build/merge the Release body section ----------------
            let body = rel.body || '';
            const sectionTitle = `${SECTION_TITLE_PREFIX} \`${tag}\` (only \`/manuscript/*.md\`)`;
            const notes = touched.length
              ? touched.map(t => `- ${t.message} ([${t.sha.slice(0,7)}](${t.url}))`).join('\n')
              : '_No changes in `/manuscript/*.md` for this release._';

            const newSection = `${sectionTitle}\n\n${notes}\n`;

            // Replace any previous "Manuscript changes" section, or append if none
            const sectionMatcher = new RegExp(
              String.raw`^${SECTION_TITLE_PREFIX.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} .*?(?:\n(?=### )|\n?$)`,
              'ms'
            );
            if (sectionMatcher.test(body)) {
              body = body.replace(sectionMatcher, newSection.trim());
            } else {
              body = (body ? body + '\n\n' : '') + newSection;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: rel.id,
              body
            });
            core.info('Updated release body with filtered notes.');

            // ------------- Patch website index.html with a link to this release -
            // Strategy:
            //  - Try to replace inner HTML of an element with id="latest-release"
            //  - Else replace a placeholder block between <!-- LATEST_RELEASE --> ... <!-- END_LATEST_RELEASE -->
            //  - Else append a small block before </body>
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: 'index.html', ref: SITE_BRANCH
              });

              if (Array.isArray(file)) {
                core.setFailed('index.html path resolves to a directory, not a file.');
                return;
              }

              const sha = file.sha;
              const original = Buffer.from(file.content, 'base64').toString('utf8');

              const releaseUrl = rel.html_url;
              const linkHtml = `<a href="${releaseUrl}">${repo} ${tag} — release notes</a>`;
              let updated;

              if (original.includes('id="latest-release"')) {
                updated = original.replace(
                  /(<[^>]*id=["']latest-release["'][^>]*>)([\s\S]*?)(<\/[^>]+>)/i,
                  `$1${linkHtml}$3`
                );
              } else if (original.includes('<!-- LATEST_RELEASE -->')) {
                updated = original.replace(
                  /<!-- LATEST_RELEASE -->[\s\S]*?<!-- END_LATEST_RELEASE -->/i,
                  `<!-- LATEST_RELEASE -->\n<div id="latest-release">${linkHtml}</div>\n<!-- END_LATEST_RELEASE -->`
                );
              } else {
                updated = original.replace(
                  /<\/body>/i,
                  `  <div id="latest-release" style="margin:1rem 0;">${linkHtml}</div>\n</body>`
                );
              }

              if (updated !== original) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo,
                  path: 'index.html',
                  message: `docs: link latest release ${tag} on index.html`,
                  content: Buffer.from(updated, 'utf8').toString('base64'),
                  sha,
                  branch: SITE_BRANCH
                });
                core.info(`index.html on ${SITE_BRANCH} updated with latest release link.`);
              } else {
                core.info('index.html unchanged (link already current).');
              }
            } catch (e) {
              core.setFailed(`Could not patch index.html on branch "${SITE_BRANCH}": ${e.message}`);
              return;
            }

# ------------------- END OF WORKFLOW ----------------------------------------
