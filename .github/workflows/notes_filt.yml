# ================================
# Workflow: Filtered Release Notes
# File: .github/workflows/notes_filt.yml
# Purpose:
#   1) Generate release notes for ONLY commits touching /manuscript/*.md
#   2) Update the Release body
#   3) Patch index.html: add "What changed?" button after "download ePub" and rename "Releases (archives)" → "Archived Versions"
#   4) Save notes to docs/release-notes/<tag>.md in the repo
# ================================

name: Generate filtered release notes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to process (must already have a published GitHub Release)"
        required: true

permissions:
  contents: write

jobs:
  manuscript_release_notes_and_link:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate filtered notes + update release + patch index.html + save file
        uses: actions/github-script@v7
        with:
          script: |
            // -------- Config --------
            const SITE_BRANCH = 'main';                              // where index.html lives
            const PATH_REGEX = /^manuscript\/[^/]+\.md$/i;           // non-recursive; use /^manuscript\/.*\.md$/i for recursive
            const NOTES_DIR = 'docs/release-notes';                  // where to save <tag>.md
            const WHAT_CHANGED_LABEL = 'What changed?';              // new button text
            const DOWNLOAD_TEXT_MATCH = /download\s*ePub/i;          // how we recognize the download button text
            const RENAME_FROM = /Releases\s*\(archives\)/i;          // rename this...
            const RENAME_TO = 'Archived Versions';                   // ...to this
            // ------------------------

            const { owner, repo } = context.repo;
            const inputTag = context.payload?.inputs?.tag;

            let rel = context.payload.release || null;
            let tag = rel?.tag_name;

            if (!rel) {
              if (!inputTag) {
                core.setFailed('No release payload and no manual tag input; provide a tag when running manually.');
                return;
              }
              tag = inputTag;
              try {
                rel = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              } catch (e) {
                core.setFailed(`Release with tag "${tag}" not found/published. Publish it first. ${e.message}`);
                return;
              }
            }
            core.info(`Processing release: ${tag}`);

            // ---- Find previous published release for diff ----
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const published = releases.filter(r => !r.draft && !r.prerelease).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
            const idx = published.findIndex(r => r.id === rel.id);
            const previousTag = idx > 0 ? published[idx-1].tag_name : null;

            // ---- Collect commits between previousTag...tag (or recent on target branch if first) ----
            let commits = [];
            if (previousTag) {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${previousTag}...${tag}` });
              commits = cmp.data.commits || [];
              core.info(`Compare ${previousTag}...${tag} → ${commits.length} commits`);
            } else {
              const target = rel.target_commitish || 'main';
              commits = await github.paginate(github.rest.repos.listCommits, { owner, repo, sha: target, per_page: 100 });
              core.info(`First release case: using ${commits.length} recent commits on ${target}`);
            }

            // ---- Filter to commits that touched /manuscript/*.md ----
            const touched = [];
            for (const c of commits) {
              const sha = c.sha;
              const comp = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              const files = comp.data.files || [];
              const hit = files.some(f => PATH_REGEX.test(f.filename));
              if (hit) {
                touched.push({
                  sha,
                  message: (c.commit?.message || '(no message)').split('\n')[0],
                  url: c.html_url
                });
              }
            }
            core.info(`Filtered commits touching manuscript: ${touched.length}`);

            // ---- Build the markdown for the notes ----
            const sectionTitle = `### Manuscript changes in \`${tag}\` (only \`/manuscript/*.md\`)`;
            const notesBody = touched.length
              ? touched.map(t => `- ${t.message} ([${t.sha.slice(0,7)}](${t.url}))`).join('\n')
              : '_No changes in `/manuscript/*.md` for this release._';
            const fullNotes = `${sectionTitle}\n\n${notesBody}\n`;

            // ---- Update Release body (replace prior section if present) ----
            let body = rel.body || '';
            const sectionHeadPrefix = '### Manuscript changes in';
            const sectionMatcher = new RegExp(
              String.raw`^${sectionHeadPrefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} .*?(?:\n(?=### )|\n?$)`,
              'ms'
            );
            if (sectionMatcher.test(body)) {
              body = body.replace(sectionMatcher, fullNotes.trim());
            } else {
              body = (body ? body + '\n\n' : '') + fullNotes;
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: rel.id, body });
            core.info('Release body updated.');

            // ---- Save notes to docs/release-notes/<tag>.md ----
            // Ensure dir exists by reading; if 404 we'll just create the file path directly.
            const pathTagMd = `${NOTES_DIR}/${tag}.md`;
            let existingSha = null;
            try {
              const cur = await github.rest.repos.getContent({ owner, repo, path: pathTagMd, ref: SITE_BRANCH });
              if (!Array.isArray(cur.data)) existingSha = cur.data.sha;
            } catch (_) { /* file likely doesn’t exist yet */ }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: pathTagMd,
              message: `docs: add filtered release notes for ${tag}`,
              content: Buffer.from(`# Release ${tag}\n\n${fullNotes}`, 'utf8').toString('base64'),
              sha: existingSha || undefined,
              branch: SITE_BRANCH
            });
            core.info(`Saved notes to ${pathTagMd}`);

            // ---- Patch index.html: add "What changed?" button after "download ePub" and rename Releases link ----
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: 'index.html', ref: SITE_BRANCH });
            if (Array.isArray(file)) {
              core.setFailed('index.html path resolves to a directory, not a file.');
              return;
            }
            const shaIndex = file.sha;
            let html = Buffer.from(file.content, 'base64').toString('utf8');

            // (1) Rename "Releases (archives)" to "Archived Versions"
            html = html.replace(RENAME_FROM, RENAME_TO);

            // (2) Insert "What changed?" button AFTER the "download ePub" button.
            // Strategy:
            //   - Find the first <a ...> whose inner text matches /download\s*ePub/i
            //   - Reuse its class attribute (if any) so styling matches
            //   - Insert a space + new <a> right after the closing </a> of that anchor

            // Regex to capture an anchor tag (greedy minimal) and its inner text
            const anchorRe = /<a([^>]*?)>([\s\S]*?)<\/a>/ig;
            let match, replaced = false, newHtml = '';
            let lastIndex = 0;

            while ((match = anchorRe.exec(html)) !== null) {
              const [full, attrPart, inner] = match;
              if (!replaced && DOWNLOAD_TEXT_MATCH.test(inner)) {
                // Extract class from the download anchor (if present)
                const classMatch = attrPart.match(/\bclass\s*=\s*["']([^"']+)["']/i);
                const classAttr = classMatch ? ` class="${classMatch[1]}"` : '';
                // Prefer linking to the release page (notes live there); alternatively to the saved file:
                const releaseUrl = rel.html_url; // e.g., https://github.com/<owner>/<repo>/releases/tag/<tag>
                const newButton = `<a${classAttr} href="${releaseUrl}">${WHAT_CHANGED_LABEL}</a>`;
                newHtml += html.slice(lastIndex, match.index) + full + ' ' + newButton;
                lastIndex = anchorRe.lastIndex;
                replaced = true;
              }
            }
            if (replaced) {
              newHtml += html.slice(lastIndex);
              html = newHtml;
            } else {
              core.info('Did not find the "download ePub" anchor to attach after; appending generic link before </body>.');
              const releaseUrl = rel.html_url;
              const fallback = `  <p><a href="${releaseUrl}">${WHAT_CHANGED_LABEL}</a></p>\n`;
              html = html.replace(/<\/body>/i, `${fallback}</body>`);
            }

            // Commit updated index.html (only if changed)
            const finalContent = Buffer.from(html, 'utf8').toString('base64');
            if (finalContent !== file.content) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'index.html',
                message: `docs: add "${WHAT_CHANGED_LABEL}" button for ${tag} and rename archives`,
                content: finalContent,
                sha: shaIndex,
                branch: SITE_BRANCH
              });
              core.info('index.html updated.');
            } else {
              core.info('index.html unchanged.');
            }
