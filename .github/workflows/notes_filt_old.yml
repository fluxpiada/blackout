# ================================
# Workflow: Filtered Release Notes + Site Patch
# File: .github/workflows/notes_filt.yml
# ================================

name: Generate filtered release notes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published tag to process"
        required: true

permissions:
  contents: write

jobs:
  manuscript_release_notes_and_link:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate filtered notes + update release + patch index.html + save file
        uses: actions/github-script@v7
        with:
          script: |
            // -------- Config --------
            const SITE_BRANCH = 'main';                       // where index.html lives
            const PATH_REGEX = /^manuscript\/[^/]+\.md$/i;    // non-recursive; use /^manuscript\/.*\.md$/i for recursive
            const NOTES_DIR  = 'docs/release-notes';          // where to save <tag>.md
            const DOWNLOAD_TEXT = /download\s*ePub/i;         // text to find the main download button
            const WHAT_CHANGED_TEXT = 'What changed?';        // new button label
            const ARCHIVES_FROM = /Releases\s*\(archives\)/i; // rename source
            const ARCHIVES_TO   = 'Archived Versions';        // rename target
            // ------------------------

            const { owner, repo } = context.repo;
            const inputTag = context.payload?.inputs?.tag;

            // Resolve release from payload or manual input
            let rel = context.payload.release || null;
            let tag = rel?.tag_name;
            if (!rel) {
              if (!inputTag) {
                core.setFailed('No release payload and no manual tag input; provide a tag when running manually.');
                return;
              }
              tag = inputTag;
              rel = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            }
            core.info(`Processing release: ${tag}`);

            // Find previous published release for diff
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const published = releases.filter(r => !r.draft && !r.prerelease)
                                      .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
            const idx = published.findIndex(r => r.id === rel.id);
            const prevTag = idx > 0 ? published[idx-1].tag_name : null;

            // Collect commits
            let commits = [];
            if (prevTag) {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${prevTag}...${tag}` });
              commits = cmp.data.commits || [];
            } else {
              const target = rel.target_commitish || 'main';
              commits = await github.paginate(github.rest.repos.listCommits, { owner, repo, sha: target, per_page: 100 });
            }

            // Filter to manuscript/*.md
            const touched = [];
            for (const c of commits) {
              const res = await github.rest.repos.getCommit({ owner, repo, ref: c.sha });
              const files = res.data.files || [];
              if (files.some(f => PATH_REGEX.test(f.filename))) {
                touched.push({
                  sha: c.sha,
                  message: (c.commit?.message || '(no message)').split('\n')[0],
                  url: c.html_url
                });
              }
            }

            // Build notes section
            const sectionTitle = `### Manuscript changes in \`${tag}\` (only \`/manuscript/*.md\`)`;
            const notes = touched.length
              ? touched.map(t => `- ${t.message} ([${t.sha.slice(0,7)}](${t.url}))`).join('\n')
              : '_No changes in `/manuscript/*.md` for this release._';
            const newSection = `${sectionTitle}\n\n${notes}\n`;

            // Update release body (replace prior "Manuscript changes" section if present)
            let body = rel.body || '';
            const sectionHeadPrefix = '### Manuscript changes in';
            const sectionMatcher = new RegExp(
              String.raw`^${sectionHeadPrefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')} .*?(?:\n(?=### )|\n?$)`,
              'ms'
            );
            body = sectionMatcher.test(body) ? body.replace(sectionMatcher, newSection.trim())
                                             : (body ? body + '\n\n' : '') + newSection;

            await github.rest.repos.updateRelease({ owner, repo, release_id: rel.id, body });

            // Save notes file docs/release-notes/<tag>.md
            const pathTagMd = `${NOTES_DIR}/${tag}.md`;
            let shaExisting = null;
            try {
              const cur = await github.rest.repos.getContent({ owner, repo, path: pathTagMd, ref: SITE_BRANCH });
              if (!Array.isArray(cur.data)) shaExisting = cur.data.sha;
            } catch {}
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: pathTagMd,
              message: `docs: add filtered release notes for ${tag}`,
              content: Buffer.from(`# Release ${tag}\n\n${newSection}`, 'utf8').toString('base64'),
              sha: shaExisting || undefined,
              branch: SITE_BRANCH
            });

            // Patch index.html: insert "What changed?" after "Download ePub" and rename archives.
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: 'index.html', ref: SITE_BRANCH });
            if (Array.isArray(file)) {
              core.setFailed('index.html path resolves to a directory.');
              return;
            }
            let html = Buffer.from(file.content, 'base64').toString('utf8');
            const shaIndex = file.sha;

            // (A) Rename "Releases (archives)" → "Archived Versions"
            html = html.replace(ARCHIVES_FROM, ARCHIVES_TO);

            // (B) Remove any old fallback link block we might have added in earlier versions
            html = html.replace(/<div id=["']latest-release["'][\s\S]*?<\/div>\s*/i, '');

            // (C) Insert the button right after the first anchor whose text matches "Download ePub".
            //     Reuse that anchor's class for styling; avoid duplicate insertion.
            const anchorRe = /<a([^>]*?)>([\s\S]*?)<\/a>/ig;
            let match, out = '', last = 0, inserted = false, alreadyPresent = false;

            // quick check: do we already have a "What changed?" button?
            if (/>\s*What\s+changed\?\s*<\/a>/i.test(html)) {
              alreadyPresent = true;
            }

            while ((match = anchorRe.exec(html)) !== null) {
              const [full, attrs, inner] = match;
              if (!inserted && !alreadyPresent && DOWNLOAD_TEXT.test(inner)) {
                const classMatch = attrs.match(/\bclass\s*=\s*["']([^"']+)["']/i);
                const classAttr  = classMatch ? ` class="${classMatch[1]}"` : '';
                const releaseUrl = rel.html_url;
                const newBtn = `<a${classAttr} href="${releaseUrl}">${WHAT_CHANGED_TEXT}</a>`;
                out += html.slice(last, match.index) + full + ' ' + newBtn;
                last = anchorRe.lastIndex;
                inserted = true;
              }
            }
            if (inserted) {
              html = out + html.slice(last);
            }

            // Commit only if changed
            const newContent = Buffer.from(html, 'utf8').toString('base64');
            if (newContent !== file.content) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'index.html',
                message: `docs: add "${WHAT_CHANGED_TEXT}" button and rename archives for ${tag}`,
                content: newContent,
                sha: shaIndex,
                branch: SITE_BRANCH
              });
            } else {
              core.info('index.html unchanged.');
            }
