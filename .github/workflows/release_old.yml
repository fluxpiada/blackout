name: Build & attach EPUB on tag

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  OUT: Blackout_Weak_Signals.epub

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Install modern Pandoc
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.11"

      # ✅ Build EPUB
      - name: Build EPUB
        shell: bash
        run: |
          mkdir -p build
          SHORT_SHA="$(git rev-parse --short HEAD)"

          # Use tag name if this is a tagged release, else use commit hash
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="commit-${SHORT_SHA}"
          fi

          # ISO date in UTC for reproducibility
          PUBLISH_DATE="$(date -u +'%Y-%m-%d')"

          pandoc manuscript/*.md \
            --from=markdown \
            --toc --toc-depth=2 \
            --metadata-file=metadata.yaml \
            --metadata=version="${VERSION}" \
            --metadata=date="${PUBLISH_DATE}" \
            --resource-path=.:manuscript:images \
            --epub-cover-image=images/cover.png \
            -o "build/${OUT}"

          ls -lh build

      # ✅ Add last-modified date to EPUB metadata
      - name: Add last-modified date to EPUB metadata
        run: |
          FILE="build/Blackout_Weak_Signals.epub"
          DATE=$(date -u -r "$FILE" +"%Y-%m-%dT%H:%M:%SZ")
          echo "📅 EPUB last modified: $DATE"

          unzip -p "$FILE" OEBPS/content.opf > content.opf
          if grep -q "<dc:date>" content.opf; then
            sed -i "s|<dc:date>.*</dc:date>|<dc:date>${DATE}</dc:date>|" content.opf
          else
            sed -i "s|</metadata>|  <dc:date>${DATE}</dc:date>\n</metadata>|" content.opf
          fi
          zip -d "$FILE" OEBPS/content.opf >/dev/null
          zip -u "$FILE" content.opf >/dev/null
          rm content.opf

      # ✅ Create release and upload asset
      - name: Create GitHub Release and upload asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/${{ env.OUT }}

  # ======================================================
  # SECOND JOB: Generate filtered notes and update index.html
  # ======================================================
  notes:
    name: Filter manuscript commits + update index.html
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate filtered notes + update release + patch index.html
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const rel = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;

            // 1️⃣ Find previous published release
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const published = releases.filter(r => !r.draft && !r.prerelease);
            published.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
            const idx = published.findIndex(r => r.id === rel.id);
            const prevTag = idx > 0 ? published[idx-1].tag_name : null;

            // 2️⃣ Compare commits between previousTag..currentTag
            let commits = [];
            if (prevTag) {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${prevTag}...${tag}`
              });
              commits = cmp.data.commits || [];
            }

            // 3️⃣ Keep only commits that touched /manuscript/*.md
            const touched = [];
            for (const c of commits) {
              const res = await github.rest.repos.getCommit({ owner, repo, ref: c.sha });
              const files = res.data.files || [];
              const hit = files.some(f => /^manuscript\/[^/]+\.md$/i.test(f.filename));
              if (hit) {
                touched.push({
                  sha: c.sha,
                  message: c.commit.message.split('\n')[0],
                  html_url: c.html_url
                });
              }
            }

            // 4️⃣ Build markdown notes
            const header = `### Manuscript changes in \`${tag}\` (only \`/manuscript/*.md\`)\n`;
            const notes = touched.length
              ? touched.map(t => `- ${t.message} ([${t.sha.slice(0,7)}](${t.html_url}))`).join('\n')
              : '_No changes in `/manuscript/*.md` for this release._';
            const newBody = `${header}\n${notes}\n`;

            await github.rest.repos.updateRelease({
              owner, repo, release_id: rel.id,
              body: (rel.body || '') + '\n\n' + newBody
            });

            // 5️⃣ Update index.html link
            const branch = 'main';
            const f = await github.rest.repos.getContent({ owner, repo, path: 'index.html', ref: branch });
            const fileSha = f.data.sha;
            const content = Buffer.from(f.data.content, 'base64').toString('utf8');
            const releaseUrl = rel.html_url;
            const linkHtml = `<a href="${releaseUrl}">${repo} ${tag} — release notes</a>`;

            let updated = content;
            if (content.includes('id="latest-release"')) {
              updated = content.replace(
                /(<[^>]*id=["']latest-release["'][^>]*>)([\s\S]*?)(<\/[^>]+>)/i,
                `$1${linkHtml}$3`
              );
            } else {
              updated = content.replace(
                /<\/body>/i,
                `  <div id="latest-release" style="margin:1rem 0;">${linkHtml}</div>\n</body>`
              );
            }

            if (updated !== content) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'index.html',
                message: `docs: link latest release ${tag} on index.html`,
                content: Buffer.from(updated, 'utf8').toString('base64'),
                sha: fileSha,
                branch
              });
            } else {
              core.info('index.html unchanged.');
            }
