name: Notes (manual)

on:
  push:
    tags:
      - "v*.*.*"      # Automatically runs when a version tag is pushed
  workflow_dispatch:   # Allows manual run from the Actions tab

inputs:
subset:
description: "Subset to process"
required: false
default: "all"

permissions:
contents: read

jobs:
notes:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: ./.github/actions/notes-sync
with:
subset: ${{ inputs.subset }}
