name: Notes (manual)

on:
  workflow_dispatch:
    inputs:
      subset:
        description: "Subset to process"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run notes sync
        run: python scripts/notes_sync.py --subset "${{ inputs.subset }}"
