on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to test (must match an existing release)"
        required: true


jobs:
  autogen_release_notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fill in release notes using GitHub's generator
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release = context.payload.release;
            const tag = release.tag_name;

            // Generate notes from commits/PRs since previous tag
            const gen = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag,
              target_commitish: release.target_commitish
              // previous_tag_name omitted so GitHub auto-detects it
            });

            // Update the newly published release body
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body: gen.data.body
            });


name: Build & attach EPUB on tag

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  OUT: Blackout_Weak_Signals.epub

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Prefer the official setup to apt (newer Pandoc, faster)
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.1.11"

      - name: Build EPUB
        shell: bash
        run: |
          mkdir -p build
          SHORT_SHA="$(git rev-parse --short HEAD)"

          # Only treat ref name as a version if this is a tag push
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="commit-${SHORT_SHA}"
          fi

          # ISO date in UTC for reproducibility
          PUBLISH_DATE="$(date -u +'%Y-%m-%d')"

          pandoc manuscript/*.md \
            --from=markdown \
            --toc --toc-depth=2 \
            --metadata-file=metadata.yaml \
            --metadata=version="${VERSION}" \
            --metadata=date="${PUBLISH_DATE}" \
            --resource-path=.:manuscript:images \
            --epub-cover-image=images/cover.png \
            -o "build/${OUT}"

          ls -lh build

      - name: Create GitHub Release and upload asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/${{ env.OUT }}

          # Append this job to your existing release.yml (do not alter other jobs/steps)
on:
  release:
    types: [published]

jobs:
  manuscript_release_notes_and_link:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate filtered notes + update release + patch index.html
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const inputTag = context.payload?.inputs?.tag;
            const rel = context.payload.release || (inputTag
              ? (await github.rest.repos.getReleaseByTag({ owner, repo, tag: inputTag })).data : null);
            const tag = rel?.tag_name || inputTag;

            // 1) Find previous published release tag (fallback: previous tag by date)
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const published = releases.filter(r => r.draft === false && r.prerelease === false);
            // sort by created_at ascending
            published.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
            const idx = published.findIndex(r => r.id === rel.id);
            const prevTag = idx > 0 ? published[idx-1].tag_name : null;

            // Fallback to nearest previous tag if releases didn’t exist before
            let previousTag = prevTag;
            if (!previousTag) {
              const tags = await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 });
              // sort by commit date (approx via order returned); pick first tag != current
              const otherTags = tags.map(t => t.name).filter(n => n !== tag);
              previousTag = otherTags.length ? otherTags[0] : null;
            }

            // 2) Compare commits between previousTag..currentTag
            let commits = [];
            if (previousTag) {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo,
                basehead: `${previousTag}...${tag}`
              });
              commits = cmp.data.commits || [];
            } else {
              // If no previous tag, use commits reachable by this tag only (last 200)
              const tagSha = rel.target_commitish || (await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})).data.object.sha;
              const log = await github.paginate(github.rest.repos.listCommits, { owner, repo, sha: tagSha, per_page: 100 });
              commits = log.slice(0, 200);
            }

            // 3) Keep only commits that touched /manuscript/*.md
            const touched = [];
            for (const c of commits) {
              const sha = c.sha;
              const res = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              const files = res.data.files || [];
              const hit = files.some(f => /^manuscript\/[^/]+\.md$/i.test(f.filename));
              if (hit) {
                touched.push({
                  sha,
                  message: (c.commit && c.commit.message) ? c.commit.message.split('\n')[0] : '(no message)',
                  html_url: c.html_url
                });
              }
            }

            // 4) Build markdown notes
            let body = rel.body || '';
            const header = `### Manuscript changes in \`${tag}\` (only \`/manuscript/*.md\`)\n`;
            let notes = '';
            if (touched.length) {
              notes = touched.map(t => `- ${t.message} ([${t.sha.slice(0,7)}](${t.html_url}))`).join('\n');
            } else {
              notes = '_No changes in `/manuscript/*.md` for this release._';
            }
            const newSection = `${header}\n${notes}\n`;
            // replace old section if present, else append
            const beginMarker = '### Manuscript changes in';
            const idxSection = body.indexOf(beginMarker);
            if (idxSection >= 0) {
              // remove existing manuscript section (up to next H3 or end)
              const before = body.slice(0, idxSection);
              const after = body.slice(idxSection);
              const nextH3 = after.indexOf('\n### ');
              body = before + newSection + (nextH3 >= 0 ? after.slice(nextH3+1) : '');
            } else {
              body = (body ? body + '\n\n' : '') + newSection;
            }

            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: rel.id,
              body
            });

            // 5) Patch index.html on `main` to include/refresh the link to this release
            //    Strategy: look for an element id="latest-release" and replace its anchor.
            //    If not present, append a small block before </body>.
            const branch = 'main';
            let fileSha = null;
            let content = null;
            try {
              const f = await github.rest.repos.getContent({ owner, repo, path: 'index.html', ref: branch });
              if (Array.isArray(f.data)) throw new Error('index.html path resolves to a directory');
              fileSha = f.data.sha;
              content = Buffer.from(f.data.content, 'base64').toString('utf8');
            } catch (e) {
              core.setFailed(`Could not read index.html on ${branch}: ${e.message}`);
              return;
            }

            const releaseUrl = rel.html_url;
            const linkHtml = `<a href="${releaseUrl}">${repo} ${tag} — release notes</a>`;
            let updated = null;

            if (content.includes('id="latest-release"')) {
              updated = content.replace(
                /(<[^>]*id=["']latest-release["'][^>]*>)([\s\S]*?)(<\/[^>]+>)/i,
                `$1${linkHtml}$3`
              );
            } else if (content.includes('<!-- LATEST_RELEASE -->')) {
              updated = content.replace(
                /<!-- LATEST_RELEASE -->[\s\S]*?<!-- END_LATEST_RELEASE -->/i,
                `<!-- LATEST_RELEASE -->\n<div id="latest-release">${linkHtml}</div>\n<!-- END_LATEST_RELEASE -->`
              );
            } else {
              updated = content.replace(
                /<\/body>/i,
                `  <div id="latest-release" style="margin:1rem 0;">${linkHtml}</div>\n</body>`
              );
            }

            if (updated !== content) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: 'index.html',
                message: `docs: link latest release ${tag} on index.html`,
                content: Buffer.from(updated, 'utf8').toString('base64'),
                sha: fileSha,
                branch
              });
            } else {
              core.info('index.html unchanged (link already current).');
            }

