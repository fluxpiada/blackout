# ============================================================
# Workflow: GitHub Pages Deploy for "blackout"
# ============================================================

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Rewrite relative OG/Twitter image URLs to absolute
      - name: Rewrite OG/Twitter image URLs to absolute
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const base = `https://${owner}.github.io/${repo}`;
            const targets = ['index.html'];

            function rewriteMeta(html, prop) {
              const re = new RegExp(
                `<meta\\s+(?:property|name)=["']${prop}["']\\s+content=["']([^"']+)["']\\s*\\/?>`,
                'ig'
              );
              return html.replace(re, (m, url) => {
                if (url.startsWith('http://') || url.startsWith('https://')) return m;
                const normalized = url.replace(/^\//, '');
                const absolute = `${base}/${normalized}`;
                return m.replace(url, absolute);
              });
            }

            for (const file of targets) {
              if (!fs.existsSync(file)) {
                core.info(`Skip: ${file} not found`);
                continue;
              }
              let html = fs.readFileSync(file, 'utf8');
              const before = html;
              html = rewriteMeta(html, 'og:image');
              html = rewriteMeta(html, 'twitter:image');

              if (html !== before) {
                fs.writeFileSync(file, html, 'utf8');
                core.info(`✅ Rewrote relative OG/Twitter image URLs in ${file}`);
              } else {
                core.info(`No relative OG/Twitter image URLs found in ${file}`);
              }
            }

      # 3️⃣ Configure Pages and upload
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # 4️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
