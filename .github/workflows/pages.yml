name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite OG/Twitter image URLs to absolute
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const base = `https://${owner}.github.io/${repo}`;
            const targets = ['index.html'];
            function rewriteMeta(html, prop) {
              const re = new RegExp(`<meta\\s+(?:property|name)=["']${prop}["']\\s+content=["']([^"']+)["']\\s*\\/?>`,'ig');
              return html.replace(re, (m, url) => {
                if (url.startsWith('http')) return m;
                const normalized = url.replace(/^\//, '');
                return m.replace(url, `${base}/${normalized}`);
              });
            }
            for (const f of targets) {
              if (!fs.existsSync(f)) continue;
              let html = fs.readFileSync(f, 'utf8');
              const before = html;
              html = rewriteMeta(html, 'og:image');
              html = rewriteMeta(html, 'twitter:image');
              if (html !== before) fs.writeFileSync(f, html, 'utf8');
            }

      # 🔽 NEW: Insert latest-release EPUB links
      - name: Insert EPUB download links into index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching latest release assets..."
          latest_release=$(gh api repos/${{ github.repository }}/releases/latest --jq '.assets[] | select(.name | endswith(".epub")) | {name: .name, url: .browser_download_url}')
          if [ -z "$latest_release" ]; then
            echo "⚠️ No EPUB assets found in the latest release."
            exit 0
          fi

          echo "<!-- AUTOGENERATED EPUB LINKS -->" > epub_links.html
          echo "<ul>" >> epub_links.html
          echo "$latest_release" | jq -r '"<li><a href=\"\(.url)\" download>\(.name)</a></li>"' >> epub_links.html
          echo "</ul>" >> epub_links.html

          # Insert before closing body tag (if present)
          if grep -q '</body>' index.html; then
            sed -i '/<\/body>/e cat epub_links.html' index.html
          else
            cat epub_links.html >> index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
