name: Pages

on:
  push:
    tags:
      - "v*.*.*"      # automatically runs on tagged releases
  workflow_dispatch:   # also allows manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🧩 build your site (this runs pages.py or similar)
      - uses: ./.github/actions/build-site
        with:
          out: dist

      # 🧱 assemble output folder
      - name: Assemble site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/
          ls -lah site

      # 📦 upload and deploy to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
