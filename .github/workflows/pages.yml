name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            poetry.lock

      - name: Install deps
        run: |
          if [ -f pyproject.toml ]; then
            pip install -U pip
            pip install .
          elif [ -f requirements.txt ]; then
            pip install -U pip
            pip install -r requirements.txt
          fi

      - name: Build site (Python does the heavy lifting)
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_site.py --out dist --commit "$GITHUB_SHA"

      - name: Upload site artifact (dist only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
