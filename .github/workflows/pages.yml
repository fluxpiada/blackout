name: pages
on:
  release:
    types: [published]   # triggers only when a release is created or published
  workflow_dispatch:      # allows manual run if you want

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site artifact
        run: |
          mkdir -p _site
          # Example: copy README or metadata to your site
          cp README.md _site/index.md
          # You can also generate a release listing, EPUB links, etc.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
